services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
      POSTGRES_DB: docmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"

volumes:
  pgdata:
